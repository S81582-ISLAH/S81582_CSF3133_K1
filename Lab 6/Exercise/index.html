<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <!-- Header -->
        <header>
            <h1>Web Dev Quiz</h1>
            <div class="timer" id="timer">Time: 15s</div>
        </header>

        <!-- Question Section -->
        <section id="question-section">
            <h2 id="question-text">Question text goes here</h2>
            <div id="options-container" class="options">
                <!-- Options will be generated by JS -->
            </div>
        </section>

        <!-- Feedback Section -->
        <section id="feedback" class="feedback hidden"></section>

        <!-- Navigation/Submit Button -->
        <div class="controls">
            <button id="next-btn" onclick="nextQuestion()" class="hidden">Next Question</button>
        </div>

        <!-- Footer / Score Display -->
        <footer>
            <p>Score: <span id="score">0</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html> <!-- Basic HTML structure -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, Paper, Scissors Game</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS -->
</head>
<body>
    <header> <!-- Game title and instructions -->
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <section class="player-section"> <!-- Player name input and start button -->
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" placeholder="Enter name">
        <button onclick="startGame()">Start Game</button>
    </section>

    <section class="game-section"> <!-- Main play area containing buttons and images -->
        <div class="buttons"> <!-- Choice buttons for the player -->
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>
        </div>
        
        <div class="images"> <!-- Container for player and computer images -->
            <div class="image-box"> <!-- Holds player image and label -->
                <p>You</p>
                <img id="playerImg" src="rock.png" alt="Player Choice">
            </div>
            <div class="vs">VS</div>
            <div class="image-box"> <!-- Holds computer image and label -->
                <p>Computer</p>
                <img id="computerImg" src="rock.png" alt="Computer Choice">
            </div>
        </div>
    </section>

    <section class="result-section"> <!-- Displays round result and scoreboard -->
        <p id="result"></p> <!-- Dynamic text for win/lose/draw -->
        <div class="scoreboard">
            Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span> | Draws: <span id="draws">0</span>
        </div>
    </section>

    <section class="history-section"> <!-- Table to log past rounds -->
        <h3>History</h3>
        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody> <!-- Rows are inserted here via JavaScript -->
            </tbody>
        </table>
    </section>

    <section class="controls"> <!-- Action buttons for summary and reset -->
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
    </section>

    <footer> <!-- Start time and copyright info -->
        <p id="startTime"></p> <!-- Timestamp inserted via JavaScript -->
        &copy; 2026 Computer Science Club
    </footer>

    <script src="game.js"></script> <!-- Link to external JavaScript -->
</body>
</html>
